title: Suspicious Scheduled Task Creation via schtasks
id: 3a8b7c6d-1e2f-4a5b-9c8d-7e6f5a4b3c2d
status: experimental
description: Detects creation of a scheduled task via schtasks.exe, commonly used by attackers to establish persistence on a compromised host.
author: Ahmed Mahmoud
date: 2026/08/25
references:
    - https://attack.mitre.org/techniques/T1053/005/
tags:
    - attack.persistence
    - attack.privilege_escalation
    - attack.t1053.005
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/create'
    condition: selection
falsepositives:
    - Legitimate scheduled task creation by IT administrators
    - Software installers configuring update tasks
level: medium
