title: Suspicious Access to LSASS Memory
id: 8c7b6a5d-4e3f-2a1b-9c8d-7e6f5a4b3c9d
status: experimental
description: Detects processes attempting to access LSASS memory, a common technique used to dump credentials (e.g., via Mimikatz or similar tools) for credential access.
author: Ahmed Mahmoud
date: 2026/08/25
references:
    - https://attack.mitre.org/techniques/T1003/001/
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    product: windows
    category: process_access
detection:
    selection:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess:
            - '0x1010'
            - '0x1410'
            - '0x1438'
            - '0x143a'
            - '0x1fffff'
    condition: selection
falsepositives:
    - Legitimate security tools performing memory analysis
    - Endpoint detection and response (EDR) agents
level: critical
